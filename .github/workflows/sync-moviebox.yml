name: Sync MovieBox Plugins JSON

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4

      - name: Fetch and Filter MovieBox Plugins
        run: |
          echo "Fetching plugins.json from upstream..."
          curl -s https://raw.githubusercontent.com/NivinCNC/CNCVerse-Cloud-Stream-Extension/builds/plugins.json -o upstream_plugins.json

          python3 -c '
import json

try:
    with open("upstream_plugins.json", "r") as f:
        data = json.load(f)

    # MovieBox എന്ന് പേരുള്ള എക്സ്റ്റൻഷൻ മാത്രം അരിച്ചെടുക്കുന്നു
    filtered_plugins = [p for p in data if "MovieBox" in p.get("name", "")]

    with open("plugins.json", "w") as f:
        json.dump(filtered_plugins, f, indent=2)

    print(f"Successfully generated plugins.json with {len(filtered_plugins)} plugin(s).")
except Exception as e:
    print("Error processing json:", e)
'
          rm -f upstream_plugins.json

      - name: Commit and Push Changes Manually
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          git add plugins.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Hourly Sync: Updated MovieBox index from upstream"
            git push origin main --force
          fi
          

