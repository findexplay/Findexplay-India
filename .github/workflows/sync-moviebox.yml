name: Sync MovieBox Plugins JSON

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download and Filter Plugins
        run: |
          curl -s https://raw.githubusercontent.com/NivinCNC/CNCVerse-Cloud-Stream-Extension/main/plugins.json -o upstream.json
          python3 -c "
import json
with open('upstream.json', 'r') as f:
    data = json.load(f)
filtered = [p for p in data if 'MovieBox' in p.get('name', '')]
with open('plugins.json', 'w') as f:
    json.dump(filtered, f, indent=2)
"
          rm -f upstream.json

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add plugins.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync MovieBox plugins.json" && git push)
