name: Sync MovieBox Plugins JSON

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and Filter JSON
        run: |
          curl -s https://raw.githubusercontent.com/NivinCNC/CNCVerse-Cloud-Stream-Extension/main/plugins.json -o upstream.json
          python3 -c "
          import json
          with open('upstream.json', 'r') as f:
              data = json.load(f)
          filtered = [p for p in data if 'MovieBox' in p.get('name', '')]
          with open('plugins.json', 'w') as f:
              json.dump(filtered, f, indent=2)
          "
          rm -f upstream.json

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sync MovieBox plugins.json" && git push)
